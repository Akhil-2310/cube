name: Sepolia Prize Keeper

on:
  schedule:
    # GitHub's shortest supported interval. Runs may start a few minutes late.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sepolia-prize-keeper
  cancel-in-progress: false

jobs:
  advance-draws:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Open, close, or settle the next required lifecycle step
        run: npm run keeper:once
        env:
          # Public V8 Sepolia deployment; only the signer key and RPC URL are secrets.
          VAULT_ADDRESS: "0x4294f12aE993561B5b6e966A653468f59cC9C39f"
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          KEEPER_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          KEEPER_CHAIN_ID: "11155111"
          KEEPER_SETTLEMENT_BATCH_SIZE: "16"
          KEEPER_MAX_BATCHES_PER_TICK: "4"
          # closeDraw() atomically harvests remaining yield, so no separate pre-close tx is needed.
          KEEPER_HARVEST_BEFORE_CLOSE: "false"
